<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভিডিও ডাউনলোডার</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2230; --muted:#6b7385; --accent:#4f46e5; --err:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --card:#181c2e; --text:#e8ebf5; --muted:#99a1b8; --accent:#7c75ff; --err:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans Bengali",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; }
  .card { width:100%; max-width:480px; background:var(--card); border-radius:16px; padding:22px; height:fit-content; box-shadow:0 4px 20px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:14px; }
  input, select, button { width:100%; font-size:16px; padding:13px; border-radius:10px; border:1px solid #8884; background:transparent; color:var(--text); font-family:inherit; }
  select option { color:#000; }
  .row { margin-bottom:12px; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .preview { display:none; margin-bottom:12px; }
  .preview img { width:100%; border-radius:10px; }
  .preview .t { margin-top:8px; font-weight:600; font-size:15px; }
  .preview .m { color:var(--muted); font-size:13px; }
  #msg { margin-top:12px; font-size:14px; min-height:20px; word-break:break-word; }
  .err { color:var(--err); }
  .note { margin-top:16px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>ভিডিও ডাউনলোডার</h1>
  <p class="sub">ভিডিওর লিংক পেস্ট করুন, ফোনে ডাউনলোড হবে</p>

  <div class="row"><input id="url" type="url" inputmode="url" placeholder="ভিডিও লিংক এখানে পেস্ট করুন"></div>
  <div class="row"><button id="checkBtn" onclick="checkVideo()">ভিডিও খুঁজুন</button></div>

  <div class="preview" id="preview">
    <img id="thumb" alt="">
    <div class="t" id="title"></div>
    <div class="m" id="meta"></div>
  </div>

  <div id="dlBox" style="display:none">
    <div class="row">
      <select id="quality">
        <option value="best">সেরা কোয়ালিটি</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="audio">শুধু অডিও</option>
      </select>
    </div>
    <button id="dlBtn" onclick="startDownload()">ডাউনলোড করুন</button>
  </div>

  <div id="msg"></div>
  <p class="note">শুধু নিজের বা ডাউনলোডের অনুমতি আছে এমন কনটেন্ট ডাউনলোড করুন। কপিরাইট ও সাইটের নিয়ম মানা আপনার দায়িত্ব।</p>
</div>

<script>
  // একই Render সার্ভার থেকে সাইট চালালে খালি রাখুন।
  // আলাদা জায়গায় রাখলে শেষে "/" ছাড়া লিংক দিন, যেমন: "https://downloader-yu1r.onrender.com"
  const API_BASE = "";

  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };

  function fmt(s) {
    if (!s) return "";
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  async function checkVideo() {
    const url = $("url").value.trim();
    if (!url) return msg("আগে লিংক দিন", true);
    $("checkBtn").disabled = true;
    msg("খোঁজা হচ্ছে... (প্রথমবার একটু সময় লাগতে পারে)");
    $("preview").style.display = "none";
    $("dlBox").style.display = "none";
    try {
      const r = await fetch(API_BASE + "/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const d = await r.json();
      if (!r.ok) throw new Error((d.error || "সমস্যা হয়েছে") + (d.detail ? " — " + d.detail : ""));
      if (d.thumbnail) $("thumb").src = d.thumbnail;
      $("title").textContent = d.title;
      $("meta").textContent = [d.uploader, fmt(d.duration)].filter(Boolean).join(" • ");
      $("preview").style.display = "block";
      $("dlBox").style.display = "block";
      msg("");
    } catch (e) {
      msg(e.message, true);
    }
    $("checkBtn").disabled = false;
  }

  function startDownload() {
    const url = encodeURIComponent($("url").value.trim());
    const q = $("quality").value;
    msg("ডাউনলোড প্রস্তুত হচ্ছে, কিছুক্ষণ অপেক্ষা করুন। বড় ভিডিওতে কয়েক মিনিট লাগতে পারে, পেজ বন্ধ করবেন না।");
    $("dlBtn").disabled = true;
    window.location.href = API_BASE + "/api/download?url=" + url + "&q=" + q;
    setTimeout(() => { $("dlBtn").disabled = false; }, 15000);
  }
</script>
</body>
</html>
