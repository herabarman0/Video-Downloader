<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ভিডিও ডাউনলোডার</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2230; --muted:#6b7385; --accent:#4f46e5; --err:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --card:#181c2e; --text:#e8ebf5; --muted:#99a1b8; --accent:#7c75ff; --err:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans Bengali",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; padding:20px; }
  /* margin:auto = শুরুতে পর্দার মাঝখানে, কনটেন্ট বাড়লে কার্ড নিজে বড় হবে */
  .card { width:100%; max-width:480px; margin:auto; background:var(--card); border-radius:16px; padding:22px; height:fit-content; box-shadow:0 4px 20px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:14px; }
  input, select, button, .btn { width:100%; font-size:16px; padding:13px; border-radius:10px; border:1px solid #8884; background:transparent; color:var(--text); font-family:inherit; }
  select option { color:#000; }
  .row { margin-bottom:12px; }
  button, .btn { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; display:block; text-align:center; text-decoration:none; }
  button:disabled { opacity:.6; }

  /* লিংক বক্স + এক ক্লিকে মোছার বাটন */
  .input-wrap { position:relative; }
  .input-wrap input { padding-right:46px; }
  .clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; padding:0; border-radius:50%; background:#8883; color:var(--text); font-size:18px; line-height:32px; display:none; }

  /* শুধু ভিডিও মোড: ১৬:৯ বক্স, কোনো লেখা নেই (টাইটেল শুধু ফাইলের নামের জন্য লুকানো থাকে) */
  .preview { display:none; margin-bottom:12px; }
  .preview .thumb { width:100%; aspect-ratio:16 / 9; background:#000; border-radius:10px; overflow:hidden; }
  .preview .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .preview .thumb video { display:none; width:100%; height:100%; object-fit:contain; background:#000; }
  .preview .t, .preview .m { display:none; }

  .result { display:none; margin-top:14px; padding:14px; border-radius:12px; background:#8881; font-size:14px; }
  .result p { margin:0 0 10px; line-height:1.5; }
  #msg { margin-top:12px; font-size:14px; min-height:20px; word-break:break-word; }
  .err { color:var(--err); }
  .note { margin-top:16px; font-size:12px; color:var(--muted); }

  /* ফুটার: নাম + সোশ্যাল আইকন */
  .footer { margin-top:14px; padding-top:14px; border-top:1px solid #8883; text-align:center; font-size:12px; color:var(--muted); }
  .footer .icons { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .footer .icons a { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; border:1px solid #8884; color:var(--muted); text-decoration:none; }
  .footer .icons a:active, .footer .icons a:hover { color:var(--accent); border-color:var(--accent); }
  .footer .sep { width:1px; height:20px; background:#8884; margin:0 2px; }
</style>
</head>
<body>
<div class="card">
  <h1>ভিডিও ডাউনলোডার</h1>
  <p class="sub">ভিডিওর লিংক পেস্ট করুন, ফোনে ডাউনলোড হবে</p>

  <div class="row input-wrap">
    <input id="url" type="url" inputmode="url" placeholder="ভিডিও লিংক এখানে পেস্ট করুন" oninput="toggleClear()">
    <button class="clear" id="clearBtn" type="button" onclick="clearAll()" aria-label="মুছে ফেলুন">✕</button>
  </div>
  <div class="row"><button id="checkBtn" onclick="checkVideo()">ভিডিও খুঁজুন</button></div>

  <div class="preview" id="preview">
    <div class="thumb">
      <img id="thumb" alt="">
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="t" id="title"></div>
    <div class="m" id="meta"></div>
  </div>

  <div id="dlBox" style="display:none">
    <div class="row">
      <select id="quality">
        <option value="best">সেরা কোয়ালিটি</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="audio">শুধু অডিও</option>
      </select>
    </div>
    <button id="dlBtn" onclick="startDownload()">ডাউনলোড করুন</button>
  </div>

  <div class="result" id="result">
    <p id="resultText"></p>
    <a class="btn" id="directLink" href="#" target="_blank" rel="noopener noreferrer"></a>
  </div>

  <div id="msg"></div>
  <p class="note">শুধু নিজের বা ডাউনলোডের অনুমতি আছে এমন কনটেন্ট ডাউনলোড করুন। কপিরাইট ও সাইটের নিয়ম মানা আপনার দায়িত্ব।</p>

  <div class="footer">
    <div>© <span id="yr">2026</span> Hera Barman</div>
    <div class="icons">
      <a href="https://www.tiktok.com/@luckyhera0" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">

      </a>
      <a href="https://www.youtube.com/@luckyhera0" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>

<script>
  // একই Render সার্ভার থেকে সাইট চালালে খালি রাখুন।
  // আলাদা জায়গায় রাখলে শেষে "/" ছাড়া লিংক দিন, যেমন: "https://downloader-yu1r.onrender.com"
  const API_BASE = "";

  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
  const errText = d => (d.error || "সমস্যা হয়েছে") + (d.detail ? " — " + d.detail : "");

  // ---------- Telegram Mini App সাপোর্ট ----------
  const TG = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(TG && TG.initData);
  if (TG) { TG.ready(); TG.expand(); }

  // ফাইলের নাম: শুরুর "32K views · 1.1K reactions |" বাদ, # ইমোজি ইত্যাদি বাদ
  function fileName() {
    const ext = $("quality").value === "audio" ? "m4a" : "mp4";
    const base = ($("title").textContent || "")
      .replace(/^\s*[\d.,]+\s*[KMBkmb]?\s*(views?|plays?|reactions?|likes?)\b[^|]*\|\s*/i, "")
      .replace(/\s*\|\s*/g, " - ")
      .replace(/[\uFE00-\uFE0F]/g, "")
      .replace(/[^\p{L}\p{N}\p{M} ._-]+/gu, " ")
      .replace(/\s+/g, " ")
      .replace(/^[. -]+|[. -]+$/g, "")
      .slice(0, 60)
      .trim();
    return (base || "video") + "." + ext;
  }

  // Telegram-এর ভেতরে হলে Telegram-এর নিজস্ব ডাউনলোড, পুরনো Telegram হলে মূল ব্রাউজারে, সাধারণ ব্রাউজারে সরাসরি
  function goDownload(url) {
    const full = new URL(url, location.href).href;
    if (inTelegram) {
      if (TG.downloadFile && TG.isVersionAtLeast && TG.isVersionAtLeast("8.0")) {
        TG.downloadFile({ url: full, file_name: fileName() }, ok => {
          msg(ok ? "ডাউনলোড শুরু হয়েছে, Telegram-এর ডাউনলোড দেখুন।" : "ডাউনলোড বাতিল হয়েছে।");
        });
      } else {
        TG.openLink(full);
      }
    } else {
      window.location.href = full;
    }
  }

  function serverUrl() {
    return API_BASE + "/api/download?url=" + encodeURIComponent($("url").value.trim()) + "&q=" + $("quality").value;
  }

  // ---------- শুধু ভিডিও মোড ----------
  // সরাসরি লিংক আছে এমন সাইটে (Facebook, Twitter/X, Vimeo) ছবির জায়গায় সরাসরি ভিডিও প্লেয়ার আসে।
  // ভিডিও সোর্স সাইট থেকে ফোনে আসে, সার্ভারের ব্যান্ডউইথ লাগে না। বাকি সাইটে ছবিই থাকে।
  function resetPlayer() {
    const v = $("player");
    v.onerror = null;
    v.pause();
    v.removeAttribute("src");
    v.removeAttribute("poster");
    v.load();
    v.style.display = "none";
    $("thumb").style.display = "";
  }

  async function prepareVideo(url) {
    try {
      const r = await fetch(API_BASE + "/api/resolve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, q: "best" })
      });
      const d = await r.json();
      if (!r.ok || !d.url) return;
      if ($("url").value.trim() !== url) return;   // ইতিমধ্যে অন্য লিংক দেওয়া হলে বাদ
      const v = $("player");
      v.onerror = () => { if (v.getAttribute("src")) resetPlayer(); };
      const poster = $("thumb").getAttribute("src");
      if (poster) v.poster = poster;
      v.src = d.url;
      v.style.display = "block";
      $("thumb").style.display = "none";
    } catch (e) { /* ছবিই থাকবে */ }
  }

  // ---------- লিংক মোছা ----------
  function toggleClear() {
    $("clearBtn").style.display = $("url").value ? "block" : "none";
  }

  function clearAll() {
    $("url").value = "";
    $("preview").style.display = "none";
    $("dlBox").style.display = "none";
    $("result").style.display = "none";
    resetPlayer();
    $("thumb").removeAttribute("src");
    $("title").textContent = "";
    $("meta").textContent = "";
    msg("");
    toggleClear();
    $("url").focus();
  }

  async function checkVideo() {
    const url = $("url").value.trim();
    if (!url) return msg("আগে লিংক দিন", true);
    $("checkBtn").disabled = true;
    msg("খোঁজা হচ্ছে... (প্রথমবার একটু সময় লাগতে পারে)");
    $("preview").style.display = "none";
    $("dlBox").style.display = "none";
    $("result").style.display = "none";
    resetPlayer();
    try {
      const r = await fetch(API_BASE + "/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(errText(d));
      if (d.thumbnail) $("thumb").src = d.thumbnail; else $("thumb").removeAttribute("src");
      $("title").textContent = d.title || "";
      $("meta").textContent = "";
      $("preview").style.display = "block";
      $("dlBox").style.display = "block";
      msg("");
      prepareVideo(url);
    } catch (e) {
      msg(e.message, true);
    }
    $("checkBtn").disabled = false;
  }

  // ---------- ফলাফল বক্স (সরাসরি লিংক / বটের লিংক) ----------
  const FILE_TEXT = "সরাসরি ডাউনলোড লিংক পাওয়া গেছে। নিচের বাটনে চাপলে ভিডিও ব্রাউজারে খুলবে। সেখান থেকে ব্রাউজারের মেনু (⋮) → Download চাপুন, বা ভিডিওতে লং-প্রেস করে Save video বেছে নিন।";
  const BOT_TEXT = "ভিডিওটা Telegram বটের মাধ্যমে পাবেন। নিচের বাটনে চাপলে Telegram খুলবে, Start চাপলেই ভিডিও চলে আসবে।";

  function showResult(kind, href) {
    const a = $("directLink");
    a.href = href;
    a.dataset.kind = kind;
    a.textContent = kind === "bot" ? "Telegram-এ ভিডিও নিন" : "সরাসরি ভিডিও খুলুন";
    $("resultText").textContent = kind === "bot" ? BOT_TEXT : FILE_TEXT;
    $("result").style.display = "block";
  }

  // ব্রাউজারে যে সাইটের ভিডিও ঠিকমতো নামে না (যেমন Facebook, Instagram) সেগুলো বটের মাধ্যমে আসে
  async function sendViaBot(url) {
    // Telegram-এর ভেতরে: ভিডিও সরাসরি চ্যাটে চলে আসে, ইউজারকে আলাদা কিছু করতে হয় না
    if (inTelegram) {
      const r = await fetch(API_BASE + "/api/bot-send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, init_data: TG.initData })
      });
      if (r.ok) {
        msg("ডাউনলোড শুরু হচ্ছে...");
        setTimeout(() => TG.close(), 1200);
        return;
      }
    }
    // সাধারণ ব্রাউজারে: বটের লিংক, Start চাপলেই ভিডিও আসে
    const r2 = await fetch(API_BASE + "/api/bot-link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const d2 = await r2.json();
    if (!r2.ok) throw new Error(errText(d2));
    showResult("bot", d2.link);
    msg("");
  }

  async function startDownload() {
    const url = $("url").value.trim();
    const q = $("quality").value;
    $("result").style.display = "none";
    $("dlBtn").disabled = true;
    msg("প্রস্তুত হচ্ছে...");
    try {
      const r = await fetch(API_BASE + "/api/resolve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, q })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(errText(d));

      if (d.mode === "bot") {
        await sendViaBot(url);
      } else if (d.mode === "direct") {
        showResult("file", d.url);
        msg("");
      } else {
        msg(inTelegram
          ? "ডাউনলোডের অনুমতি চাওয়া হচ্ছে। বড় ভিডিওতে কয়েক মিনিট লাগতে পারে।"
          : "ডাউনলোড শুরু হচ্ছে। বড় ভিডিওতে কয়েক মিনিট লাগতে পারে, পেজ বন্ধ করবেন না।");
        goDownload(serverUrl());
      }
    } catch (e) {
      msg(e.message, true);
    }
    setTimeout(() => { $("dlBtn").disabled = false; }, 4000);
  }

  // Telegram-এর ভেতরে সরাসরি লিংকও মূল ব্রাউজারে খুলবে
  $("directLink").addEventListener("click", e => {
    if (!inTelegram) return;
    e.preventDefault();
    const a = $("directLink");
    if (a.dataset.kind === "bot" && TG.openTelegramLink) TG.openTelegramLink(a.href);
    else goDownload(a.href);
  });

  // Telegram-এর ভেতরে ফুটারের সোশ্যাল লিংক ঠিকমতো খোলার জন্য
  document.querySelectorAll(".footer .icons a").forEach(a => {
    a.addEventListener("click", e => {
      if (!inTelegram) return;
      e.preventDefault();
      if (a.href.startsWith("https://t.me/") && TG.openTelegramLink) TG.openTelegramLink(a.href);
      else TG.openLink(a.href);
    });
  });

  // ফুটারে বছর নিজে থেকে বদলাবে
  $("yr").textContent = new Date().getFullYear();
</script>
